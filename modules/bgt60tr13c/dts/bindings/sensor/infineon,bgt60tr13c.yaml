description: |
  Infineon BGT60TR13C 60 GHz FMCW radar sensor.

  Standard SPI-child properties (reg, spi-max-frequency, duplex,
  frame-format, spi-interframe-delay-ns, spi-cpol, spi-cpha, ...) are
  inherited from spi-device.yaml.

compatible: "infineon,bgt60tr13c"

include: spi-device.yaml

properties:
  reset-gpios:
    type: phandle-array
    required: true
    description: Sensor hard reset (RSTN), typically active low.

  irq-gpios:
    type: phandle-array
    required: false
    description: |
      FIFO-ready interrupt output from the sensor. Rising edge when
      FIFO fill level reaches SFCTL.FIFO_CREF. If present the driver
      signals a waiting thread via wait_fifo_ready(); if absent the
      caller must poll get_fifo_status().