CONFIG_BUILD_OUTPUT_HEX=y
#CONFIG_SHELL=y
#CONFIG_LOG=y

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
#CONFIG_SHELL_BACKEND_SERIAL=y

#CONFIG_MAIN_STACK_SIZE=2048
CONFIG_PM=y
CONFIG_PM_DEVICE=y #Exposes the pm_device_action_cb to the PM subsystem, enabling pm inside the driver.
CONFIG_PM_DEVICE_RUNTIME=y #Activates device runtime PM. Device Driver indicates when it needs the device
CONFIG_PM_DEVICE_POWER_DOMAIN=y#Enables Power Domain feature.
CONFIG_DEVICE_DEPS=y
CONFIG_BOOT_BANNER=n
#CONFIG_LOG=y
#CONFIG_LOG_DEFAULT_LEVEL=4
#CONFIG_SHELL=y
#CONFIG_SERIAL=y
#CONFIG_CONSOLE=y
#CONFIG_UART_CONSOLE=y
#CONFIG_SHELL_BACKEND_SERIAL=y
#CONFIG_DEVICE_SHELL=y
#CONFIG_LOG=y
#CONFIG_PM_DEVICE_SHELL=y
CONFIG_INSTRUMENTATION_TRIGGER_FUNCTION="instrumentation_trigger"
CONFIG_INSTRUMENTATION=y
CONFIG_INSTRUMENTATION_MODE_CALLGRAPH=y
CONFIG_INSTRUMENTATION_EXCLUDE_FILE_LIST="isr_wrapper,xip,bitmask,version,spi,i2c,adc,pwm,wdt,usb,mem,cy_crypto,cy_ble,cy_tcpwm,cy_adc,cy_dac,cy_smartio,cy_sdhc,cmsis,crypto,dma,cy_mpc,cy_ppc,cy_trigmux,qspi,assert,bitarray"
#CONFIG_INSTRUMENTATION_EXCLUDE_FUNCTION_LIST="pm_device_runtime_is_enabled,device_is_ready,pm_device_is_busy,pm_device_wakeup_is_enabled,pm_device_action_run,main,k_busy_wait,sys_clock_elapsed,any_cpu_announcing,this_cpu_announcin,runq_bes,next_up,update_cache,sys_clock_cycle_get_32,arch_k_cycle_get_32,k_cycle_get_3,arch_irq_lock,arch_irq_unlock,timeout"
CONFIG_INSTRUMENTATION_MODE_CALLGRAPH_TRACE_BUFFER_SIZE=65000
CONFIG_INSTRUMENTATION_MODE_CALLGRAPH_BUFFER_OVERWRITE=y
CONFIG_INSTRUMENTATION_STOPPER_FUNCTION="instrumentation_stopper"
CONFIG_INSTRUMENTATION_DYNAMIC_TRIGGER=n