# Zephyr shell over the SCB UART console.
CONFIG_SHELL=y

# Shell serial backend: IRQ-driven RX. This lets the CPU stay in WFI
# indefinitely while waiting for a keypress, instead of polling the
# UART FIFO every CONFIG_SHELL_BACKEND_SERIAL_RX_POLL_PERIOD ms (10 ms
# default) which produces a visible 100 Hz spike train on the PPK2
# rail and keeps the "idle" baseline artificially elevated.
#
# HISTORICAL NOTE: an earlier revision of this project pinned the
# backend to CONFIG_SHELL_BACKEND_SERIAL_API_POLLING because the
# Infineon SCB UART driver's IRQ path spun forever on the first RX
# byte (Unhandled IRQn: 121 / bt_uart_isr hang, see
# doc/ifx_uart_driver_bug.md). That bug has since been fixed in
# zephyr/drivers/serial/uart_infineon_pdl.c
# (ifx_cat1_uart_irq_update now W1Cs RX_NOT_EMPTY and RX/TX error
# latches). The IRQ backend is now the correct choice.
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_SHELL_BACKEND_SERIAL_API_INTERRUPT_DRIVEN=y

# Enable the ARM idle-entry hook so the `noidle` shell command can
# veto WFI in the idle thread. When noidle is on, the CPU spin-loops
# through arch_cpu_idle() instead of sleeping -- lets us measure
# real active current at HP/LP/ULP, and gives the upcoming `sleep`
# command a non-sleeping baseline to compare against.
#
# ARM_ON_ENTER_CPU_IDLE_HOOK is a promptless symbol -- the app-local
# Kconfig defines APP_ENABLE_IDLE_HOOK which selects it.
CONFIG_APP_ENABLE_IDLE_HOOK=y

# Shell size trims to fit the 63 KB RRAM code region (rram snippet).
# We only need three top-level commands (hp / lp / ulp); help text,
# tab-completion, VT100 escapes and command history all cost ~1-2 KB
# each in RRAM and are not required for this demo.
CONFIG_SHELL_HELP=n
CONFIG_SHELL_HISTORY=n
CONFIG_SHELL_METAKEYS=n
CONFIG_SHELL_VT100_COMMANDS=n
CONFIG_SHELL_TAB=n
CONFIG_SHELL_TAB_AUTOCOMPLETION=n

# GPIO for the three on-board RGB indicator LEDs used by the shell
# handlers to signal the incoming mode before the SoC starts changing
# clocks / voltage.
CONFIG_GPIO=y

# Main stack: 4 KiB gives plenty of headroom for the LP/ULP transition
# code path which unrolls Cy_SysPm_SystemEnter{Hp,Lp,Ulp} + RRAM +
# ClkHf writes plus their PDL callback lists.
CONFIG_MAIN_STACK_SIZE=4096
