CONFIG_BGT60TR13C=y
CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
# Room for ~10 back-to-back frame lines at the frame cadence without drops.
CONFIG_LOG_BUFFER_SIZE=4096

# Networking stack
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=n
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y

CONFIG_NET_PKT_RX_COUNT=10
CONFIG_NET_PKT_TX_COUNT=10
CONFIG_NET_BUF_RX_COUNT=20
CONFIG_NET_BUF_TX_COUNT=20
CONFIG_NET_MAX_CONTEXTS=10

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_NET_TX_STACK_SIZE=1536
CONFIG_NET_RX_STACK_SIZE=1536

# Stack sizes for threads that drive Wi-Fi connect / DHCP.
# net_mgmt(NET_REQUEST_WIFI_CONNECT, ...) runs synchronously through the
# WHD stack and overflows the default 1 KB system-workqueue stack.
# Matches the board.conf that app 08 uses on M55.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4608
CONFIG_NET_TCP_WORKQ_STACK_SIZE=2048

# Net management events (needed for connect / dhcp callbacks)
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16

# Wi-Fi (headless, no shell)
CONFIG_WIFI=y

# Random number generator (required by networking)
CONFIG_TEST_RANDOM_GENERATOR=y

# Heap for WHD / AIROC driver allocations - matches app 08
CONFIG_HEAP_MEM_POOL_SIZE=20480

# Silence noisy SPI/GPIO/clock debug logs
CONFIG_SPI_LOG_LEVEL_WRN=y
CONFIG_GPIO_LOG_LEVEL_WRN=y

# Clock control
CONFIG_CLOCK_CONTROL=y
CONFIG_CLOCK_CONTROL_LOG_LEVEL_WRN=y

# Ensure SPI init priority is correct
CONFIG_SPI_INIT_PRIORITY=70