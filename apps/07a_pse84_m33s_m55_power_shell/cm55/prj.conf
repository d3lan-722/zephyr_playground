CONFIG_BUILD_OUTPUT_HEX=y

# No TF-M. The CM33-Secure side of this project boots CM55 directly
# via its local pse84_boot_local::app_pse84_cm55_startup(); no PSA
# relay / SRF mailbox is needed since we never call PSA APIs.
CONFIG_BUILD_WITH_TFM=n
# CONFIG_PSOC_EDGE_M55_SRF_SUPPORT is not set

# Silence CM55 -- both cores' consoles would land on the same SCB2
# TX FIFO. CM33-S owns the shell UX; CM55 must not emit banners.
CONFIG_BOOT_BANNER=n
CONFIG_PRINTK=n
