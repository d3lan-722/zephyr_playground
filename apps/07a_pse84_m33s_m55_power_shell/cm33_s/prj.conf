# Zephyr shell over the SCB UART console.
CONFIG_SHELL=y

# Shell serial backend: IRQ-driven RX. Lets the CPU stay in WFI
# indefinitely between keypresses instead of polling every
# CONFIG_SHELL_BACKEND_SERIAL_RX_POLL_PERIOD ms, which would produce
# a 100 Hz spike train on the PPK2 rail.
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_SHELL_BACKEND_SERIAL_API_INTERRUPT_DRIVEN=y

# Idle-hook so `noidle` can veto WFI (defined in Kconfig; selects
# ARM_ON_ENTER_CPU_IDLE_HOOK). Consumer is src/cmd_noidle.c.
CONFIG_APP_ENABLE_IDLE_HOOK=y

# Shell size trims -- keep the rram code region compact. Same set
# as project 06; drop these if `hp`/`lp`/`ulp` help text or history
# is wanted.
CONFIG_SHELL_HELP=n
CONFIG_SHELL_HISTORY=n
CONFIG_SHELL_METAKEYS=n
CONFIG_SHELL_VT100_COMMANDS=n
CONFIG_SHELL_TAB=n
CONFIG_SHELL_TAB_AUTOCOMPLETION=n

# GPIO for the three on-board RGB indicator LEDs and the P3.1
# pm-busy scope trigger.
CONFIG_GPIO=y

# 4 KiB main stack: LP/ULP transition unrolls SysPm callback
# lists + RRAM/ClkHf writes.
CONFIG_MAIN_STACK_SIZE=4096

# --- System timer ------------------------------------------------------
# LPTIMER (MCWDT0 on PILO, 32.768 kHz) instead of SysTick. SysTick
# would scale with HF0 across HP/LP/ULP; MCWDT runs off PILO which is
# independent of every HF clock and stays alive through CPU deep
# sleep -- so it also doubles as the DS wake source.
CONFIG_CORTEX_M_SYSTICK=n
CONFIG_INFINEON_LP_TIMER_PDL=y
CONFIG_SYS_CLOCK_HW_CYCLES_PER_SEC=32768

# --- No TF-M -----------------------------------------------------------
# CM33 runs as Secure directly; CM55 is released by our local
# pse84_boot_local. No TF-M SPE and no SRF/mailbox relay.
CONFIG_BUILD_WITH_TFM=n
# CONFIG_SOC_PSE84_M55_ENABLE deliberately NOT set: the upstream
# ifx_pse84_cm55_startup() called from soc_late_init_hook ends in
# for(;;), which would trap the CM33 forever. We call our own
# app_pse84_cm55_startup() from main() instead.

# --- Build outputs -----------------------------------------------------
CONFIG_BUILD_OUTPUT_HEX=y
