CONFIG_BUILD_OUTPUT_HEX=y
CONFIG_GPIO=y

# Enable the TF-M mailbox/relay so the CM55 non-secure image can reach
# the TF-M Secure Processing Environment running on this CM33-NS core.
# Must be set on BOTH the CM33-NS and CM55 images of the paired build.
CONFIG_PSOC_EDGE_M55_SRF_SUPPORT=y

# Zephyr shell on the existing UART console. SHELL_BACKEND_SERIAL and the
# help/history features default to y once CONFIG_SHELL is set.
CONFIG_SHELL=y

# Force the shell serial backend to polling mode. The Infineon SCB UART
# on PSE84 does not have a working interrupt-driven path in this build
# (see doc/ifx_uart_driver_bug.md); with the default interrupt-driven
# backend the shell triggers "Unhandled IRQn: 121" as soon as the first
# character is received.
CONFIG_SHELL_BACKEND_SERIAL_API_POLLING=y
