CONFIG_BUILD_OUTPUT_HEX=y
CONFIG_GPIO=y

# CM55 side of the TF-M paired build: routes PSA calls through the
# mailbox relay to the TF-M SPE running on the CM33. Must match the
# value set in the CM33-NS image.
CONFIG_PSOC_EDGE_M55_SRF_SUPPORT=y

# Silence CM55 -- both cores' consoles land on the same SCB2 TX FIFO
# by default, and CM33-NS owns the shell UX. Without these, CM55's
# "*** Booting Zephyr OS ***" banner interleaves with the CM33-NS
# banner + shell prompt after every reset, producing garbled output
# like "uart:~*** Booting Zephyr OS build ***".
CONFIG_BOOT_BANNER=n
CONFIG_PRINTK=n
