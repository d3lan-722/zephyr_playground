# Application configuration for CM33 non-secure image of project 07.
#
# Fuses project 02's TF-M paired-build scaffolding with project 06's
# shell-driven power-mode UX. Deliberately omits CONFIG_PM: the shell
# owns HP/LP/ULP + sleep + deep_sleep entry directly, no Zephyr PM
# residency policy runs.

# ---------- TF-M paired-build ------------------------------------------------

# Emit a hex image alongside the ELF; needed for `west flash`.
CONFIG_BUILD_OUTPUT_HEX=y

# Enable the TF-M mailbox/relay so the CM55 non-secure image can reach
# the TF-M Secure Processing Environment running on this CM33-NS core.
# Also triggers soc_pse84_m33_ns.c to call Cy_SysEnableCM55 at boot,
# which is what unblocks system-DEEPSLEEP voting later. Must be set on
# BOTH the CM33-NS and CM55 images.
CONFIG_PSOC_EDGE_M55_SRF_SUPPORT=y

# Idle stack must fit tfm_ns_interface_dispatch's fpu_ctx_full alloca
# (136 bytes) plus everything on top -- see the file-header comment in
# project 02's cm33_ns/src/power.c. The Zephyr default (320 B) blows
# past PSPLIM on the deepest NS->S chains. 2048 gives ample headroom.
CONFIG_IDLE_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=4096

# Diagnostics: stack canary + full fault-frame dump on hard fault.
CONFIG_INIT_STACKS=y
CONFIG_FAULT_DUMP=2

# ---------- Zephyr PM (disabled) --------------------------------------------

# Explicitly NOT set:
#   CONFIG_PM=y             -- shell drives every PM transition,
#                              no residency policy needed.
#   CONFIG_PM_POLICY_DEFAULT
#   CONFIG_TICKLESS_KERNEL  -- kept at project defaults; not required
#                              without a PM policy.

# ---------- Shell + `noidle` idle-hook (from project 06) ---------------------

# Zephyr shell over the SCB2 UART console.
CONFIG_SHELL=y

# Shell serial backend: polling instead of IRQ-driven.
#
# TEMPORARY: on CM33-NS under TF-M on this SoC/build, enabling the
# IRQ-driven serial backend produces "Unhandled IRQn: 121" the moment
# the shell RX enables the UART interrupt. IRQ 121 on the CM33 map is
# tcpwm_0_interrupts_259, so this looks like an interrupt routing /
# NVIC-line mismatch specific to the CM33-NS + TF-M multicore build
# path -- project 06 (CM33-S, no TF-M) uses IRQ-driven fine at IRQ 143
# for the same SCB2. To investigate later; polling backend is a stable
# workaround for the demo.
CONFIG_UART_INTERRUPT_DRIVEN=n
CONFIG_SHELL_BACKEND_SERIAL_API_POLLING=y

# Raise the shell RX poll period from the 10 ms default to 500 ms so
# the resulting CPU-wake spike train drops from ~77 Hz to ~2 Hz. That
# is far more forgiving for PPK2-based DVFS current measurements
# (windowing between spikes / averaging is easy at 2 Hz) at the cost
# of a mean 250 ms keypress-echo latency, which is imperceptible for
# interactive shell commands but noticeable if you paste a long
# script. Change back to 10 (or fix the IRQ backend, see comment
# above) if the demo starts feeling sluggish.
CONFIG_SHELL_BACKEND_SERIAL_RX_POLL_PERIOD=500

# Enable z_arm_on_enter_cpu_idle() so the `noidle` shell command can
# veto WFI in the idle thread. Symbol is promptless in upstream
# Zephyr; the app-local Kconfig defines APP_ENABLE_IDLE_HOOK which
# selects it. The hook function itself is defined in src/cmd_noidle.c.
CONFIG_APP_ENABLE_IDLE_HOOK=y

# ---------- Kernel tick on MCWDT0 (survives DeepSleep) -----------------------

# SysTick is clocked from HF0 (CM33 core clock), which future phases
# reprogram per HP/LP/ULP. That would make k_msleep / k_cycle_get_32
# report 3-4x too long at LP/ULP. MCWDT0 runs off PILO (32.768 kHz),
# independent of every HF clock and alive across CPU deep sleep too,
# so it doubles as a deep-sleep wake source.
CONFIG_CORTEX_M_SYSTICK=n
CONFIG_INFINEON_LP_TIMER_PDL=y
CONFIG_SYS_CLOCK_HW_CYCLES_PER_SEC=32768

# ---------- Peripherals -----------------------------------------------------

CONFIG_GPIO=y

# ---------- TF-M diagnostics -------------------------------------------------

# Verbose SPM logs + exception-frame dump on fatal errors in the SPE.
# TFM_HALT_ON_CORE_PANIC is applied via TFM_CMAKE_OPTIONS in
# CMakeLists.txt (not a Kconfig here).
CONFIG_TFM_SPM_LOG_LEVEL_DEBUG=y
CONFIG_TFM_EXCEPTION_INFO_DUMP=y
