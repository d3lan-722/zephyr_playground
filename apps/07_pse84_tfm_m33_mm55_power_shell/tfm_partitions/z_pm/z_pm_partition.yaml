#-------------------------------------------------------------------------------
# Zephyr PM out-of-tree TF-M secure partition.
#
# Purpose: provide an S-side dispatcher that NS Zephyr can call to perform
# PSE84 power-management actions that touch PPC-protected peripherals
# (PWRMODE/SRSS). The partition runs at PC2 (TF-M) so it has access to those
# regions; NS Zephyr does not.
#
# Model: SFN (no message-loop, no IPC thread).
# Type:  PSA-ROT (PSE84 EPC2 puts all SPE partitions at PC2 anyway, but
#        future regions may require highest-trust access).
#-------------------------------------------------------------------------------

{
  "psa_framework_version": 1.1,
  "name": "TFM_SP_Z_PM",
  "type": "PSA-ROT",
  "priority": "NORMAL",
  "model": "SFN",
  "entry_init": "z_pm_partition_init",
  "stack_size": "0x2000",

  "services": [
    {
      "name": "Z_PM_SERVICE",
      "sid": "0xFFFFF800",
      "non_secure_clients": true,
      "connection_based": false,
      "stateless_handle": 17,
      "version": 1,
      "version_policy": "STRICT"
    }
  ]
}
