# Board-specific Kconfig overrides for kit_pse84_ai M55.
# Matches the working reference:
#   zephyr/samples/net/wifi/shell/boards/kit_pse84_eval_pse846gps2dbzc4a_m55.conf
#
# The board Kconfig.defconfig already picks CYW55500 + CYW55513_MURATA_2FY_SM
# for the LBEE5HY2FY module on kit_pse84_ai when CONFIG_WIFI=y.

CONFIG_SHELL_STACK_SIZE=6144
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4608
CONFIG_NET_TCP_WORKQ_STACK_SIZE=2048
CONFIG_IDLE_STACK_SIZE=1024
