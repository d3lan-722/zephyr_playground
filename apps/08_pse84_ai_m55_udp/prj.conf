# General
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_GPIO=y

# Networking stack
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y

CONFIG_NET_SOCKETS=y

CONFIG_NET_PKT_RX_COUNT=10
CONFIG_NET_PKT_TX_COUNT=10
CONFIG_NET_BUF_RX_COUNT=20
CONFIG_NET_BUF_TX_COUNT=20
CONFIG_NET_MAX_CONTEXTS=10

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_NET_TX_STACK_SIZE=1536
CONFIG_NET_RX_STACK_SIZE=1536

# Wi-Fi
CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_SHELL=y

# SDHC / SDIO logging
#CONFIG_SDHC_LOG_LEVEL_WRN=y
#CONFIG_SD_LOG_LEVEL_WRN=y

# Net management events
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16

# Shell / console (useful for interactive Wi-Fi commands)
CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_NET_SHELL=y

# Random number generator (required by networking)
CONFIG_TEST_RANDOM_GENERATOR=y

# Heap for WHD / AIROC driver allocations
CONFIG_HEAP_MEM_POOL_SIZE=20480
