# Available runners configured by board.cmake.
runners:
- openocd
- probe-rs

# Default flash runner if --runner is not given.
flash-runner: openocd

# Default debug runner if --runner is not given.
debug-runner: openocd

# Common runner configuration values.
config:
  board_dir: /home/ubuntu/zephyrproject/zephyr/boards/infineon/kit_pse84_ai
  # Build outputs:
  elf_file: zephyr.elf
  hex_file: zephyr.hex
  bin_file: zephyr.bin
  # Host tools:
  gdb: /usr/local/zephyr-sdk-1.0.1/gnu/arm-zephyr-eabi/bin/arm-zephyr-eabi-gdb-py
  openocd: /usr/local/openocd/bin/openocd
  openocd_search:
    - /usr/local/zephyr-sdk-1.0.1/hosttools/sysroots/x86_64-pokysdk-linux/usr/share/openocd/scripts

# Runner specific arguments
args:
  openocd:
    - --cmd-load
    - flash write_image erase
    - --cmd-verify
    - verify_image
    - --gdb-init=disconnect
    - --gdb-init=target extended-remote :3334
    - --target-handle=CHIPNAME.cm55
    - --no-load
    - --no-targets
    - --no-halt
    - --cmd-erase=erase_all
    - --gdb-init=maint flush register-cache
    - --gdb-init=tb main
    - --gdb-init=continue
  probe-rs:
    - --chip=PSE846GPS4DBZC4A
