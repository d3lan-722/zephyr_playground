description: Generic fixed-rate clock provider

compatible: "infineon,clock-hf"

include: fixed-factor-clock.yaml

properties:
  system-clock:
    type: int
    required: true
    description: |
      The type of clock (refer to include/.../dt-bindings/clock/ifx_clock_source_common.h):
      path_mux5 : system-clock = <IFX_PATHMUX>
      clk_hf0   : system-clock = <IFX_HF>

  instance:
    type: int
    required: true
    description: |
      Instance of a given clock type.
      path_mux5 : instance = <5>
      clk_hf0   : instance = <0>

  input-sources:
    type: phandles
    required: true
    description: List of clock path sources

  "#clock-cells":
    const: 2

clock-cells:
  - path_sel
  - div_value

  
