description: Generic fixed-rate clock provider

compatible: "infineon,clock-pll"

include: fixed-factor-clock.yaml

properties:
  system-clock:
    type: int
    required: true
    description: |
      Clock producer identifier
      clk_iho  : system-clock = <IFX_IHO>
      clk_pilo : system-clock = <IFX_PILO>

  input:
    type: phandle
    required: true
    description: Clock-path multiplexer supplying the DPLL reference.

  clock-frequency:
    type: int
    description: output clock frequency (Hz)
    required: true
  
  enable: 
    type: int
    
  bypass-sel:
    type: int

  dco-mode-enable:
    type: boolean

  output-div:
    type: int
  
  reference-div:
    type: int

  feedback-div:
    type: int

  fraction-enable:
    type: int

  fraction-div:
    type: int
    description: Sets the frac_div value in f_OUT = f_REF(N + FRAC_DIV/2^24)

  div-p:
    type: int

  div-n:
    type: int

  div-k:
    type: int

  freq-mode-sel:
    type: int

  flock-enable-threshold:
    type: int

  lf-beta-value:
    type: int

  "#clock-cells":
    type: int
    const: 8

clock-cells:
  - enable
  - bypass
  - dco
  - output
  - reference
  - feedback
  - fraction
  - fraction-div