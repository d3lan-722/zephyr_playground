CONFIG_BUILD_OUTPUT_HEX=y
CONFIG_GPIO=y

# Enable the TF-M mailbox/relay so the CM55 non-secure image can reach
# the TF-M Secure Processing Environment running on this CM33-NS core.
# Must be set on BOTH the CM33-NS and CM55 images of the paired build.

# Phase 2: enable the Zephyr PM core. No custom power-states declared
# yet, so the default policy will idle the CPU via WFI between blinks
# but no SoC PM hooks fire. SysTick stays as the system tick for now.
CONFIG_PM=y
CONFIG_PM_POLICY_DEFAULT=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_SYSTEM_MANAGED=y
CONFIG_TICKLESS_KERNEL=y
CONFIG_MAIN_STACK_SIZE=4096
# Round-7 finding: pm_state_set runs on the idle thread. With FPU sharing on
# (CONFIG_FPU=y + CONFIG_FPU_SHARING=y), tfm_ns_interface_dispatch's prologue
# allocates a 136-byte fpu_ctx_full on the caller's stack before invoking the
# SG veneer. The default idle stack (320 B) survives that only on the shortest
# call chain (z_pm's thin wrapper). Deeper NS→S paths (e.g. Cy_SysPm_* NS-SRF
# branch → mtb_srf_pool_allocate → ifx_mtb_srf_call → psa_call →
# tfm_ns_interface_dispatch) blow past PSPLIM at the `sub sp, #136`. Fault
# shows as HardFault with HFSR.FORCED (STKOF UsageFault escalated).
# 2048 leaves ample headroom for the deepest expected NS→S chain.
CONFIG_IDLE_STACK_SIZE=2048
CONFIG_INIT_STACKS=y
CONFIG_FAULT_DUMP=2

# Phase 3: route the kernel tick onto MCWDT0/LPTIMER (declared in the
# overlay). MCWDT0 keeps clocking through DeepSleep; SysTick does not.
CONFIG_CORTEX_M_SYSTICK=n
CONFIG_INFINEON_LP_TIMER_PDL=y

# Round-7 debug: verbose secure logging + exception frame dump on
# fatal errors in the SPE. TFM_EXCEPTION_INFO_DUMP defaults to y but
# only prints when the SPM log level is DEBUG. TFM_HALT_ON_CORE_PANIC
# (halt instead of NVIC_SystemReset on tfm_core_panic) is a TF-M
# CMake option, appended to TFM_CMAKE_OPTIONS in cm33_ns/CMakeLists.txt.

CONFIG_BUILD_OUTPUT_HEX=y
CONFIG_INSTRUMENTATION_TRIGGER_FUNCTION="instrumentation_trigger"
CONFIG_INSTRUMENTATION=y
CONFIG_INSTRUMENTATION_MODE_CALLGRAPH=y
CONFIG_INSTRUMENTATION_EXCLUDE_FILE_LIST="isr_wrapper,xip,picolib,cy_autanalog,cbprintf,boot_banner,bitmask,version,spi,i2c,adc,pwm,wdt,usb,mem,cy_crypto,cy_ble,cy_tcpwm,cy_adc,cy_dac,cy_sysanalog,cy_smartio,cy_sdhc,cmsis,crypto,dma,cy_autanalog,cy_ipc,cy_mpc,cy_ppc,cy_trigmux,qspi,mtb_hal,mtb_srf,assert,bitarray"
CONFIG_INSTRUMENTATION_EXCLUDE_FUNCTION_LIST="pm_device_runtime_is_enabled,device_is_ready,pm_device_is_busy,pm_device_wakeup_is_enabled,pm_device_action_run,main,k_busy_wait,sys_clock_elapsed,any_cpu_announcing,this_cpu_announcin,runq_bes,next_up,update_cache,sys_clock_cycle_get_32,arch_k_cycle_get_32,k_cycle_get_3,arch_irq_lock,arch_irq_unlock,timeout"
CONFIG_INSTRUMENTATION_MODE_CALLGRAPH_TRACE_BUFFER_SIZE=32768
CONFIG_INSTRUMENTATION_MODE_CALLGRAPH_BUFFER_OVERWRITE=n
CONFIG_INSTRUMENTATION_STOPPER_FUNCTION="instrumentation_stopper"
CONFIG_INSTRUMENTATION_DYNAMIC_TRIGGER=n