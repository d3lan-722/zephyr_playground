CONFIG_BUILD_OUTPUT_HEX=y
CONFIG_GPIO=y

# Enable the TF-M mailbox/relay so the CM55 non-secure image can reach
# the TF-M Secure Processing Environment running on this CM33-NS core.
# Must be set on BOTH the CM33-NS and CM55 images of the paired build.
CONFIG_PSOC_EDGE_M55_SRF_SUPPORT=y

# Phase 2: enable the Zephyr PM core. No custom power-states declared
# yet, so the default policy will idle the CPU via WFI between blinks
# but no SoC PM hooks fire. SysTick stays as the system tick for now.
CONFIG_PM=y
CONFIG_PM_POLICY_DEFAULT=y
CONFIG_TICKLESS_KERNEL=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_INIT_STACKS=y
CONFIG_FAULT_DUMP=2

# Phase 3: route the kernel tick onto MCWDT0/LPTIMER (declared in the
# overlay). MCWDT0 keeps clocking through DeepSleep; SysTick does not.
CONFIG_CORTEX_M_SYSTICK=n
CONFIG_INFINEON_LP_TIMER_PDL=y
