# Board-specific Kconfig fragment for kit_pse84_ai (M33).
# Auto-applied by the build system when this board target is selected.

# Select the AIROC chip + module actually on the KIT_PSE84_AI board.
# The upstream board Kconfig.defconfig only sets these on the M55 target;
# for M33 we must pin them here so CMake picks the CYW55513/MURATA-2FY
# firmware blob rather than falling back to CYW4343W.
CONFIG_CYW55500=y
CONFIG_CYW55513_MURATA_2FY=y

# Minimal logging at INF level so we can see host-level progress.
# Keep IMMEDIATE mode — this is the mode that worked for HCI_RESET.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_BT_LOG_LEVEL_INF=y
CONFIG_BT_HCI_DRIVER_LOG_LEVEL_INF=y
