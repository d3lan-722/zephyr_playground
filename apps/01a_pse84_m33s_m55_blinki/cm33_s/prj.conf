CONFIG_BUILD_OUTPUT_HEX=y
CONFIG_GPIO=y

# CM55 owns the shared console UART (uart2). Disable serial on CM33-S
# so the peripheral is not claimed by both cores.
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# Do NOT set CONFIG_SOC_PSE84_M55_ENABLE: that would pull in the upstream
# ifx_pse84_cm55_startup() (via soc_late_init_hook) which ends in a
# tight for(;;) loop. Our local copy in src/pse84_boot_local.c is called
# from main() instead, so the CM33-S returns and keeps running Zephyr.

# No TF-M.
CONFIG_BUILD_WITH_TFM=n
