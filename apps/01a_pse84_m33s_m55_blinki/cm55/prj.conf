CONFIG_BUILD_OUTPUT_HEX=y
CONFIG_GPIO=y

# No TF-M SPE running on the CM33 side, so the CM55 must not enable
# the SRF/mailbox relay to it. Keeping this off also drops the paired-
# build header dependency (PSE84_CM33_BUILD_DIR).
# CONFIG_PSOC_EDGE_M55_SRF_SUPPORT is not set

# No TF-M.
CONFIG_BUILD_WITH_TFM=n
